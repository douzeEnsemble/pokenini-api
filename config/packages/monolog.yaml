monolog:
    channels:
        - deprecation

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
            # file_log:
            #     type: stream
            #     path: "%kernel.logs_dir%/%kernel.environment%.log"
            #     level: debug

when@prod:
    monolog:
        handlers:
            # "main" only writes the logs when an error occurs: the duration of each message is written anyway
            messenger:
                type: error_log
                level: info
                channels: [messenger]
            main:
                type: fingers_crossed
                action_level: error
                handler: error_log_handler
                excluded_http_codes: [404, 405]
                buffer_size: 50
            error_log_handler:
                type: error_log
                level: info
