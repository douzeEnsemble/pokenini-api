security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"
  
  providers:
    users:
      memory:
        users:
          web: { password: '%env(WEB_PASSWORD)%', roles: ["ROLE_API"] }
          icon: { password: '%env(ICON_API_PASSWORD)%', roles: ["ROLE_ICON"] }

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false
    api:
      pattern: ^/
      stateless: true
      lazy: false
      provider: users
      http_basic:
        realm: Secured Area

  access_control:
    - { path: ^/istration/dex-banner-layers$, allow_if: "is_granted('ROLE_ICON') or is_granted('ROLE_API')" }
    - { path: ^/, roles: ROLE_API }
