framework:
  messenger:
    failure_transport: failed

    # Logs the duration and memory usage of each message, on the "messenger" channel
    buses:
      messenger.bus.default:
        middleware:
          - logging

    transports:
      async:
        dsn: "%env(MESSENGER_TRANSPORT_DSN)%"
        retry_strategy:
          max_retries: 0
      failed: "doctrine://default?queue_name=failed"
      sync: "sync://"

    routing:
      "*": async

when@test:
  framework:
    messenger:
      transports:
        async: "in-memory://?serialize=true"
        sync: "in-memory://?serialize=true"
