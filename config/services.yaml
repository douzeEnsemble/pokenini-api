services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $spreadsheetId: '%env(SPREADSHEET_ID)%'
            string $googleApiSheetsUrl: '%env(GOOGLE_API_SHEETS_URL)%'
            int $eloKFactor: '%env(ELO_K_FACTOR)%'
            int $eloDDifference: '%env(ELO_D_DIFFERENCE)%'
            int $eloDefault: '%env(ELO_DEFAULT)%'
            string $sqlDir: '%kernel.project_dir%/resources/sql'
            
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # public: true until a controller consumes this service (added in a later task in this
    # same plan) — with zero consumers, Symfony's compiler drops the service definition
    # entirely, which breaks direct retrieval via self::getContainer()->get() in tests.
    App\Service\Election\ElectionReportService:
        public: true
