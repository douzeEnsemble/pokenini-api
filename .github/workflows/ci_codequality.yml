name: CI Code Quality

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        description: "Docker Hub username"
        required: true
      DOCKERHUB_TOKEN:
        description: "Docker Hub token"
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  PHP_CS_FIXER_IGNORE_ENV: 1

jobs:
  editorconfig:
    name: EditorConfig
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run
        run: docker run --rm --volume=$PWD:/check mstruebing/editorconfig-checker:4.0.2 editorconfig-checker --exclude=".phar"

  phpcsfixer:
    name: Format (PHP-CS-Fixer)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tool's Composer install
        uses: ./.github/actions/tools-composer
        with:
          dir: php-cs-fixer
      - name: Run
        run: ./tools/php-cs-fixer/vendor/bin/php-cs-fixer check --diff

  phpmd:
    name: Complexité (PHPMD)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tool's Composer install
        uses: ./.github/actions/tools-composer
        with:
          dir: phpmd
      - name: Run
        run: ./tools/phpmd/vendor/bin/phpmd src,tests text phpmd.ruleset.xml

  psalm:
    name: Analyse statique (Psalm)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Composer install
        uses: ./.github/actions/local-composer
      - name: Tool's Composer install
        uses: ./.github/actions/tools-composer
        with:
          dir: psalm
      # psalm/plugin-symfony 5.16.3 validates the container against an XSD that lacks the
      # "env_closure" argument type, which Symfony 8.2 uses: drop this step once the plugin knows it.
      - name: Work around psalm/plugin-symfony and the env_closure argument type
        run: sed -i 's/type="env_closure"/type="string"/g' var/cache/test/App_KernelTestDebugContainer.xml
      - name: Run
        run: |
          tools/psalm/vendor/bin/psalm -c psalm.xml  --show-info=false --no-cache --find-unused-psalm-suppress --no-suggestions --root=.
          tools/psalm/vendor/bin/psalm -c psalm-src-only.xml --show-info=false --no-cache --find-unused-psalm-suppress --no-suggestions --root=.

  phpstan:
    name: Analyse statique (PHPStan)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Composer install
        uses: ./.github/actions/local-composer
      - name: Tool's Composer install
        uses: ./.github/actions/tools-composer
        with:
          dir: phpstan
      - name: Initialize
        run: |
          ./tools/phpstan/vendor/bin/phpstan clear-result-cache
      - name: Run
        run: |
          ./tools/phpstan/vendor/bin/phpstan analyse --memory-limit=-1

  deptrac:
    name: Architecture (Deptrac)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tool's Composer install
        uses: ./.github/actions/tools-composer
        with:
          dir: deptrac
      - name: Run
        run: ./tools/deptrac/vendor/bin/deptrac analyse --report-uncovered --fail-on-uncovered

  lint-expressions:
    name: Expressions (lint:expressions)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Composer install
        uses: ./.github/actions/local-composer
      - name: Run
        run: php bin/console lint:expressions

  lint-yaml:
    name: YAML et schéma (lint:yaml)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Composer install
        uses: ./.github/actions/local-composer
      - name: Run
        run: php bin/console lint:yaml config --check-schema
